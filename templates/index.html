<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberRoute — Hyderabad IT Corridor</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=14" />
</head>
<body>

  <div id="map"></div>

  <aside id="sidebar">

    <div id="brand">
      <span id="brand-logo">🛣️</span>
      <div id="brand-text">
        <div id="brand-name">CyberRoute</div>
        <div id="brand-sub">Cyberabad commute · Live</div>
      </div>
      <div id="status-pill" class="pill pill-loading">…</div>
    </div>

    <div id="go-banner" class="banner banner-loading">Checking traffic…</div>

    <div id="dir-bar">
      <button class="dir-btn dir-btn-active" data-dir="all">All</button>
      <button class="dir-btn" data-dir="to">→ Inbound</button>
      <button class="dir-btn" data-dir="from">← Outbound</button>
    </div>

    <!-- Trip planner — hero action -->
    <div class="section planner-section" id="trip-section">
      <select id="trip-select" class="select">
        <option value="">Choose your route…</option>
      </select>
      <div id="trip-result" class="trip-result hidden"></div>
      <div id="leave-by-row" class="leave-by-row hidden">
        <label class="leave-by-label">Need to arrive by</label>
        <input type="time" id="arrive-by-input" class="time-input" />
        <div id="leave-by-result" class="leave-by-result"></div>
      </div>
    </div>

    <!-- At-a-glance counts -->
    <div class="section">
      <div class="section-title">Right now on the corridor</div>
      <div class="cards-row">
        <div class="mini-card green"><span id="num-clear">—</span><label>Free flow</label></div>
        <div class="mini-card amber"><span id="num-slow">—</span><label>Slow</label></div>
        <div class="mini-card red"><span id="num-heavy">—</span><label>Jammed</label></div>
      </div>
    </div>

    <!-- All routes -->
    <div class="section routes-section">
      <div class="section-title">All routes <span id="route-count" class="count-badge">0</span></div>
      <div id="route-list"></div>
    </div>

    <div id="toolbar">
      <button id="btn-refresh" class="btn btn-primary">↻ Refresh</button>
      <button id="btn-locate"  class="btn">📍 Locate me</button>
    </div>

    <div id="footer">
      <div id="last-updated"></div>
      <div id="made-by">Made by <strong>Ruthvika Tammina</strong></div>
    </div>

  </aside>

  <div id="toast" class="toast hidden"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script>window.MAPBOX_TOKEN = "{{ mapboxToken }}";</script>
  <script src="/static/app.js?v=14"></script>
</body>
</html>
