<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hyderabad Traffic Live</title>

  <!-- Mapbox map library CSS (styles the map itself) -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <!-- Our custom styles -->
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- The map fills the whole screen (see styles.css #map) -->
  <div id="map"></div>

  <!-- Top header bar -->
  <header id="header">
    <div id="header-left">
      <span id="logo">🚦</span>
      <div>
        <div id="title">Hyderabad Traffic</div>
        <div id="subtitle">Live road conditions</div>
      </div>
    </div>
    <div id="status">Loading…</div>
  </header>

  <!-- Left sidebar panel -->
  <aside id="sidebar">

    <!-- ── SECTION 1: Controls ── -->
    <section class="section">
      <div class="row">
        <button id="btn-refresh" class="btn primary">↻ Refresh</button>
        <button id="btn-auto" class="btn secondary active">⏱ Auto: ON</button>
      </div>
      <div class="row" style="margin-top: 8px;">
        <button id="btn-locate" class="btn secondary">📍 My location</button>
        <select id="zone-select" class="btn secondary">
          <option value="">Jump to area…</option>
          <option value="hyderabad">Hyderabad Center</option>
          <option value="hitech">HITEC City</option>
          <option value="banjara">Banjara Hills</option>
          <option value="kukatpally">Kukatpally</option>
          <option value="gachibowli">Gachibowli</option>
        </select>
      </div>
    </section>

    <!-- ── SECTION 2: Stats ── -->
    <section class="section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Incidents</div>
          <div id="stat-count" class="stat-value">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Traffic now</div>
          <div id="stat-level" class="stat-value">—</div>
        </div>
      </div>
    </section>

    <!-- ── SECTION 3: Filter by type ── -->
    <section class="section">
      <div class="section-title">Filter</div>
      <div class="filter-row">
        <button class="filter-btn active" data-type="all">All</button>
        <button class="filter-btn" data-type="congestion">Congestion</button>
        <button class="filter-btn" data-type="slowdown">Slowdown</button>
        <button class="filter-btn" data-type="accident">Accident</button>
      </div>
    </section>

    <!-- ── SECTION 4: Colour legend ── -->
    <section class="section">
      <div class="section-title">Legend</div>
      <div class="legend">
        <div class="legend-item"><span class="dot accident"></span> Accident</div>
        <div class="legend-item"><span class="dot congestion"></span> Congestion</div>
        <div class="legend-item"><span class="dot slowdown"></span> Slowdown</div>
        <div class="legend-item"><span class="dot other"></span> Light traffic</div>
      </div>
    </section>

    <!-- ── SECTION 5: Incident list ── -->
    <section class="section" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
      <div class="section-title">Incidents <span id="list-count" style="font-weight:400; color:#888;"></span></div>
      <div id="incident-list"></div>
      <div id="list-footer"></div>
    </section>

    <div id="last-updated"></div>
  </aside>

  <!-- Mapbox JS library -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <!--
    Pass the Mapbox token from the Python server into the page.
    The {{ mapboxToken }} is replaced by Jinja2 (Python's template engine).
    We store it in window.MAPBOX_TOKEN so app.js can read it.
  -->
  <script>window.MAPBOX_TOKEN = "{{ mapboxToken }}";</script>

  <!-- Our app logic (see public/app.js) -->
  <script src="/static/app.js"></script>
</body>
</html>
